<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1c2418">
<title>Gnome Life</title>
<style>
  :root { --paper:#f3e9d2; --paper2:#e6d9bd; --ink:#2b2418; --ink2:#6b5a44; --green:#5b6b2d; --red:#b14c37; --safe-b: env(safe-area-inset-bottom); }
  html,body { margin:0; height:100%; background:#1c2418; overflow:hidden; -webkit-user-select:none; user-select:none; touch-action:none; font-family: Georgia, "Times New Roman", serif; -webkit-tap-highlight-color: transparent; }
  canvas { display:block; width:100vw; height:100vh; }
  #hud { position:fixed; left:0; right:0; top:0; padding: calc(env(safe-area-inset-top) + 10px) 14px 0; pointer-events:none; color:var(--paper); text-shadow:0 1px 2px rgba(0,0,0,.6); }
  #hud h1 { margin:0; font-size:22px; font-weight:bold; letter-spacing:.5px; }
  #hud p { margin:3px 0 0; font-size:15px; opacity:.92; line-height:1.3; }
  #hud p.busy { font-size:14px; opacity:.85; }
  #bubble { position:fixed; max-width:66vw; background:var(--paper); color:var(--ink); border-radius:14px; padding:10px 14px; font-size:16px; line-height:1.3; box-shadow:0 2px 8px rgba(0,0,0,.35); pointer-events:none; opacity:0; transition:opacity .25s; transform:translate(-50%,-100%); }
  #bubble:after { content:""; position:absolute; left:50%; bottom:-8px; margin-left:-7px; border:7px solid transparent; border-top-color:var(--paper); border-bottom:0; }
  #load { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; color:var(--paper); font-size:15px; background:#1c2418; z-index:9; }
  /* bottom bar */
  #bar { position:fixed; left:0; right:0; bottom:0; padding: 8px 10px calc(var(--safe-b) + 10px); display:flex; flex-direction:column; gap:7px; pointer-events:none; }
  .ico { width:22px; height:22px; vertical-align:middle; margin-right:3px; }
  #btns { display:flex; gap:8px; justify-content:center; pointer-events:auto; }
  .btn { flex:1; max-width:110px; min-height:60px; background:var(--paper); color:var(--ink); border:0; border-radius:16px; padding:7px 4px 6px; font:inherit; font-size:14px; font-weight:bold; letter-spacing:.2px; box-shadow:0 3px 8px rgba(0,0,0,.4), inset 0 -3px 0 rgba(43,36,24,.12); position:relative; display:flex; flex-direction:column; align-items:center; gap:3px; }
  .btn:active { transform:translateY(2px); box-shadow:0 1px 4px rgba(0,0,0,.4); }
  .btn .ic { font-size:26px; line-height:1; }
  .btn .dot { position:absolute; top:-5px; right:-5px; min-width:14px; height:18px; padding:0 4px; border-radius:9px; background:var(--red); color:var(--paper); border:2px solid var(--paper); display:none; font-size:12px; line-height:18px; text-align:center; }
  .btn.alert .dot { display:block; }
  #bPack .dot { background:var(--green); }
  .btn.pop { transform:scale(1.07); }
  /* sheet */
  #shade { position:fixed; inset:0; background:rgba(10,14,8,.35); opacity:0; pointer-events:none; transition:opacity .2s; }
  #shade.on { opacity:1; pointer-events:auto; }
  #sheet { position:fixed; left:0; right:0; bottom:0; max-height:76vh; background:var(--paper); color:var(--ink); border-radius:20px 20px 0 0; padding:16px 18px calc(var(--safe-b) + 18px); box-shadow:0 -4px 18px rgba(0,0,0,.4); transform:translateY(105%); transition:transform .25s; overflow-y:auto; touch-action:pan-y; pointer-events:auto; }
  #sheet.on { transform:none; }
  #sheet h2 { margin:0 0 6px; font-size:23px; font-weight:bold; padding-right:40px; }
  #sheet h2 small { font-size:14px; color:var(--ink2); margin-left:8px; font-weight:normal; }
  #sheet h3 { margin:16px 0 2px; font-size:14px; font-weight:bold; text-transform:uppercase; letter-spacing:1px; color:var(--ink2); }
  #sheet h3:first-of-type { margin-top:6px; }
  #sheet p { margin:6px 0 10px; font-size:16px; line-height:1.4; color:var(--ink2); }
  .row { display:flex; align-items:center; gap:12px; padding:11px 0; border-top:1px solid rgba(43,36,24,.12); }
  .row.hi { background:rgba(91,107,45,.1); margin:0 -10px; padding:11px 10px; border-radius:10px; border-top:0; }
  .row .t { flex:1; min-width:0; } .row .t b { font-weight:bold; font-size:17px; display:block; line-height:1.25; } .row .t span { font-size:14.5px; color:var(--ink2); line-height:1.35; }
  .row .t span.bad { color:var(--red); }
  .row .t .who { display:inline-block; background:rgba(91,107,45,.14); color:var(--green); font-weight:bold; font-size:13px; border-radius:6px; padding:1px 6px; margin-right:4px; }
  .act { background:var(--green); color:var(--paper); border:0; border-radius:12px; padding:12px 16px; min-height:46px; font:inherit; font-size:16px; font-weight:bold; white-space:nowrap; box-shadow:inset 0 -3px 0 rgba(0,0,0,.18); }
  .act:active { transform:translateY(1px); }
  .act[disabled] { background:var(--paper2); color:var(--ink2); box-shadow:none; }
  .act.quiet { background:var(--paper2); color:var(--ink); }
  .cost { font-size:14px; } .cost i { font-style:normal; margin-right:7px; white-space:nowrap; }
  .prog { height:7px; background:var(--paper2); border-radius:4px; overflow:hidden; margin-top:6px; } .prog i { display:block; height:100%; background:var(--green); }
  .meter { display:flex; gap:4px; margin:6px 0 10px; } .meter i { flex:1; height:10px; border-radius:5px; background:var(--paper2); } .meter i.on { background:#c9922e; box-shadow:0 0 6px #ffcf6a; }
  .jrow { display:flex; align-items:center; gap:12px; padding:10px 0; border-top:1px solid rgba(43,36,24,.12); }
  .jrow .sil { width:40px; height:40px; border-radius:50%; background:var(--paper2); display:flex; align-items:center; justify-content:center; font-size:22px; flex:none; }
  .jrow.unseen .sil { filter:grayscale(1); opacity:.5; }
  .jrow .t b { font-weight:bold; display:block; font-size:17px; } .jrow .t span { font-size:14.5px; color:var(--ink2); }
  .close { position:absolute; right:8px; top:6px; width:44px; height:44px; background:none; border:0; font:inherit; font-size:30px; line-height:44px; color:var(--ink2); }
  #toast { position:fixed; left:50%; top:calc(env(safe-area-inset-top) + 68px); transform:translateX(-50%); background:rgba(243,233,210,.96); color:var(--ink); border-radius:14px; padding:10px 16px; font-size:16px; opacity:0; transition:opacity .25s; pointer-events:none; max-width:84vw; text-align:center; box-shadow:0 2px 8px rgba(0,0,0,.3); }
  /* the pack sheet */
  .pack { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:6px; }
  .pack div { background:rgba(43,36,24,.06); border-radius:12px; padding:8px 6px; text-align:center; font-size:14px; color:var(--ink2); }
  .pack div.zero { opacity:.45; }
  .pack img { width:40px; height:40px; display:block; margin:0 auto 2px; }
  .pack b { display:block; font-size:19px; color:var(--ink); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><h1>Gnome Life</h1><p id="sub"></p><p id="busy" class="busy"></p></div>
<div id="bubble"></div>
<div id="toast"></div>
<div id="bar">
  <div id="btns">
    <button class="btn" id="bPack"><span class="ic">🧺</span>Pack<i class="dot"></i></button>
    <button class="btn" id="bTasks"><span class="ic">🔨</span>Jobs<i class="dot"></i></button>
    <button class="btn" id="bMagic"><span class="ic">✨</span>Magic<i class="dot"></i></button>
    <button class="btn" id="bJournal"><span class="ic">📖</span>Journal<i class="dot"></i></button>
  </div>
</div>
<div id="shade"></div>
<div id="sheet"></div>
<div id="load">waking the garden…</div>
<script src="content.js"></script>
<script src="game.js"></script>
<script>
(() => {
const C = window.CONTENT, G = window.GL;
const SPR = 0.5;
const PLOT = { w:1225, h:728, top:[612,1], left:[3,346], right:[1221,347], bottom:[612,691] };
const EX = [PLOT.right[0]-PLOT.top[0], PLOT.right[1]-PLOT.top[1]];   // one tile east
const EY = [PLOT.left[0]-PLOT.top[0],  PLOT.left[1]-PLOT.top[1]];    // one tile south
const ASSETS = {
  plot:'sprites/plot-barren.webp',
  // painted ground tiles (art batch 1). stream + path are loaded but not placed yet: for the town/map pass.
  'tile-barren-plain':'sprites/tile-barren-plain.webp', 'tile-barren-stumps':'sprites/tile-barren-stumps.webp',
  'tile-green':'sprites/tile-green.webp', 'tile-meadow':'sprites/tile-meadow.webp', 'tile-woodland':'sprites/tile-woodland.webp',
  'tile-barren-creek':'sprites/tile-barren-creek.webp', 'tile-barren-fence':'sprites/tile-barren-fence.webp', 'tile-barren-deadtree':'sprites/tile-barren-deadtree.webp',
  // batch 2 map tiles (stream/path bends, spring, fork, crossing) are in sprites/ but not loaded until the map pass places them.
  shelter:'sprites/shelter.webp', campfire:'sprites/campfire.webp', firewood:'sprites/firewood.webp',
  barrel:'sprites/barrel.webp', seedbed:'sprites/seedbed.webp', stonebench:'sprites/stonebench.webp',
  tub:'sprites/tub.webp', lanternstump:'sprites/lanternstump.webp', wheelbarrow:'sprites/wheelbarrow.webp',
  fence:'sprites/fence.webp', sapling:'sprites/sapling.webp',
  'him-side':'sprites/him-side.png','him-front':'sprites/him-front.png','him-back':'sprites/him-back.png',
  'her-side':'sprites/her-side.png','her-front':'sprites/her-front.png','her-back':'sprites/her-back.png',
  'him-dig':'sprites/him-dig.png','him-water':'sprites/him-water.png','him-carry':'sprites/him-carry.png','him-eat':'sprites/him-eat.png','him-sit':'sprites/him-sit.png','him-sleep':'sprites/him-sleep.png',
  'her-dig':'sprites/her-dig.png','her-water':'sprites/her-water.png','her-carry':'sprites/her-carry.png','her-eat':'sprites/her-eat.png','her-sit':'sprites/her-sit.png','her-sleep':'sprites/her-sleep.png',
  'icon-twig':'sprites/icon-twig.webp','icon-moss':'sprites/icon-moss.webp','icon-stone':'sprites/icon-stone.webp','icon-acorn':'sprites/icon-acorn.webp','icon-seed':'sprites/icon-seed.webp',
  'icon-water':'sprites/icon-water.webp','icon-light':'sprites/icon-light.webp','icon-berry':'sprites/icon-berry.webp','icon-feather':'sprites/icon-feather.webp',
};
const GNOMES = {"him":{"cell":[108,242],"dirs":{"side":8,"front":8,"back":8},"acts":{"dig":{"n":4,"cell":[144,242]},"water":{"n":4,"cell":[129,245]},"carry":{"n":4,"cell":[140,260]},"eat":{"n":4,"cell":[118,241]},"sit":{"n":4,"cell":[127,208]},"sleep":{"n":4,"cell":[264,85]}}},"her":{"cell":[122,242],"dirs":{"side":8,"front":8,"back":8},"acts":{"dig":{"n":4,"cell":[159,242]},"water":{"n":4,"cell":[148,241]},"carry":{"n":6,"cell":[105,244]},"eat":{"n":4,"cell":[102,244]},"sit":{"n":4,"cell":[119,208]},"sleep":{"n":2,"cell":[264,73]}}}};

// ---------- world helpers ----------
function tileOrigin(k) { const [tx, ty] = k.split(',').map(Number); return [tx*EX[0] + ty*EY[0], tx*EX[1] + ty*EY[1]]; }
function toWorld(gx, gy, tile = '0,0') {         // tile grid (0..1, 0..1) -> world pixel coords
  const [ox, oy] = tileOrigin(tile), [tx, ty] = PLOT.top, [rx, ry] = PLOT.right, [lx, ly] = PLOT.left;
  return [ox + tx + gx * (rx - tx) + gy * (lx - tx), oy + ty + gx * (ry - ty) + gy * (ly - ty)];
}
function fromWorld(wx, wy) {                       // world pixel -> { tile, gx, gy } (any tile, may be outside 0..1)
  const [tx, ty] = PLOT.top, a = PLOT.right[0]-tx, b = PLOT.left[0]-tx, c = PLOT.right[1]-ty, d = PLOT.left[1]-ty;
  const det = a*d - b*c, px = wx - tx, py = wy - ty;
  const u = (px*d - b*py) / det, v = (a*py - c*px) / det;           // continuous tile coords
  const txi = Math.floor(u), tyi = Math.floor(v);
  return { tile: `${txi},${tyi}`, gx: u - txi, gy: v - tyi };
}
function depthOf(gx, gy, tile = '0,0') { const [tx, ty] = tile.split(',').map(Number); return gx + gy + tx + ty; }

// ---------- scene content (home tile) ----------
const PROPS = [
  { name:'shelter',      gx:0.30, gy:0.22, s:1.0 },
  { name:'firewood',     gx:0.14, gy:0.40, s:0.9, until:'woodpile' },
  { name:'barrel',       gx:0.40, gy:0.42, s:0.9 },
  { name:'campfire',     gx:0.52, gy:0.44, s:0.9 },
  { name:'stonebench',   gx:0.66, gy:0.30, s:0.9, until:'bench' },
  { name:'lanternstump', gx:0.78, gy:0.50, s:0.9 },
  { name:'seedbed',      gx:0.60, gy:0.70, s:1.0, flat:true, until:'bed' },   // until: hidden until that job is done (fades in while it runs)
  { name:'tub',          gx:0.44, gy:0.76, s:0.85 },
  { name:'wheelbarrow',  gx:0.26, gy:0.62, s:0.9 },
  { name:'fence',        gx:0.86, gy:0.78, s:0.9 },
  { name:'sapling',      gx:0.72, gy:0.86, s:0.8 },
];
const SPOTS = {   // places the gnomes like to go (home tile)
  door:[0.36,0.33], fire:[0.46,0.52], bench:[0.62,0.36], bed:[0.56,0.66], barrel:[0.46,0.44],
  tub:[0.40,0.72], sprout:[0.50,0.52], barrow:[0.32,0.66], lantern:[0.72,0.56], fence:[0.80,0.72]
};
// where each gnome eats, sits and sleeps (daily rhythm); [gx, gy, faceTowards]
const RHYTHM = {
  him: { eat:[0.40,0.56,'campfire'], sit:[0.38,0.60,'campfire'], sleep:[0.24,0.40,null] },
  her: { eat:[0.60,0.38,'campfire'], sit:[0.62,0.42,'campfire'], sleep:[0.52,0.24,null] },
};
const ACT_FPS = { dig:4, water:3, carry:9, eat:2.5, sit:1.6, sleep:0.7 };
const SPOT_ACT = { wheelbarrow:'dig', seedbed:'water', sapling:'water', shelter:'carry', fence:'carry', stonebench:'carry', fire:'carry' };
function routineFor(h) {   // what the couple do at this hour when no job needs them
  if (h >= 22 || h < 6) return 'sleep';
  if ((h >= 7 && h < 8) || (h >= 18 && h < 19)) return 'eat';
  if (h >= 19 && h < 22) return 'sit';
  return null;
}
const WORKSPOT = { clearing:[0.54,0.66], wheelbarrow:[0.30,0.68], shelter:[0.38,0.30], fence:[0.80,0.74], sapling:[0.66,0.84], stonebench:[0.60,0.36], seedbed:[0.54,0.66] };

// ---------- loading ----------
const IM = {};
let loaded = 0; const total = Object.keys(ASSETS).length;
for (const [k, src] of Object.entries(ASSETS)) {
  const im = new Image(); im.onload = im.onerror = () => { if (++loaded === total) start(); }; im.src = src; IM[k] = im;
}

// ---------- state ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const bubble = document.getElementById('bubble'), toastEl = document.getElementById('toast');
let W = 0, H = 0, DPR = 1;
const cam = { x: PLOT.w/2, y: PLOT.h/2 - 40, z: 1 };
let minZ = 0.4, maxZ = 4;
const gnomes = [], particles = [], floaters = [];
let visitor = null, nextVisitorAt = 0;
let tod = null;
const hash = location.hash.slice(1);
for (const tok of hash.split(/[#&]/)) if (/^(day|night|dawn|dusk|morning|evening)$/.test(tok)) tod = tok;
if (/reset/.test(hash)) { G.reset(); }
window.addEventListener('hashchange', () => location.reload());

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  minZ = Math.max(0.2, Math.min(W / (PLOT.w + 80), H / (PLOT.h + 160)) * 0.95);
  cam.z = Math.max(cam.z, minZ);
}
window.addEventListener('resize', resize); resize();

// ---------- gnomes ----------
class Gnome {
  constructor(who, gx, gy) {
    this.who = who; this.gx = gx; this.gy = gy; this.tx = gx; this.ty = gy;
    this.cell = GNOMES[who].cell; this.n = GNOMES[who].dirs; this.acts = GNOMES[who].acts;
    this.dir = 'front'; this.flip = false; this.walking = false; this.frame = 0; this.ft = 0;
    this.wait = 1 + Math.random() * 2; this.speed = 0.055 + Math.random() * 0.01;
    this.say = null; this.sayT = 0; this.job = null; this.bob = 0;
    this.act = null; this.plan = null; this.routine = null; this.pace = null; this.aframe = 0; this.at = 0;
  }
  goto(x, y) { this.tx = x; this.ty = y; this.walking = true; }
  faceTowards(x, y, propName) {   // action strips face right; flip so the gnome faces the fire (or the middle of the tile)
    const p = propName && PROPS.find(p => p.name === propName); const [tx, ty] = p ? [p.gx, p.gy] : [0.5, 0.5];
    const [ax] = toWorld(x, y), [bx] = toWorld(tx, ty); this.flip = bx < ax;
  }
  pick() {
    const h = dayPhase().h, rt = routineFor(h);
    const job = G.running().find(r => r.def.who === this.who);
    if (rt === 'sleep' || (rt && !job)) {   // the daily rhythm: sleep always wins, meals and the evening sit only when no job waits
      const [sx, sy, face] = RHYTHM[this.who][rt]; this.job = null; this.plan = rt; this.routine = rt;
      if (this.act === rt) { this.wait = 2; return; }
      this.goto(sx, sy); this.faceTowards(sx, sy, face); return;
    }
    this.routine = null;
    if (job) {
      const sp = WORKSPOT[job.def.spot] || SPOTS.fire; this.job = job.id;
      this.plan = job.def.act || SPOT_ACT[job.def.spot] || (job.def.tile ? 'dig' : 'carry');
      this.pace = this.plan === 'carry' ? [[sp[0], sp[1]], [sp[0] - 0.12, sp[1] + 0.06]] : null;
      this.goto(sp[0], sp[1]); this.faceTowards(sp[0], sp[1], null); return;
    }
    this.job = null; this.plan = null; this.act = null;
    const keys = Object.keys(SPOTS); const [sx, sy] = SPOTS[keys[(Math.random() * keys.length) | 0]];
    this.goto(sx + (Math.random() - 0.5) * 0.08, sy + (Math.random() - 0.5) * 0.08);
  }
  update(dt) {
    if (this.sayT > 0) this.sayT -= dt;
    if (this.act) { this.at += dt; const n = this.acts[this.act].n, fps = ACT_FPS[this.act]; if (this.at > 1 / fps) { this.at -= 1 / fps; this.aframe = (this.aframe + 1) % n; } }
    if (!this.walking) {
      this.wait -= dt;
      if (this.job) {
        this.bob += dt * 6; const still = G.running().some(r => r.id === this.job);
        if (!still) { this.job = null; this.act = null; this.pace = null; this.wait = 0.5; return; }
        if (this.wait <= 0) {
          if (routineFor(dayPhase().h) === 'sleep') { this.pick(); return; }
          if (this.pace) { this.pace.reverse(); const [x, y] = this.pace[0]; this.goto(x, y); this.wait = 0.6; return; }   // carrying: to and fro
          this.wait = 1;
        }
        return;
      }
      if (this.routine && this.wait <= 0 && routineFor(dayPhase().h) === this.routine && !G.running().some(r => r.def.who === this.who && this.routine !== 'sleep')) { this.wait = 2; return; }
      if (this.wait <= 0) this.pick();
      return;
    }
    const dx = this.tx - this.gx, dy = this.ty - this.gy, d = Math.hypot(dx, dy);
    if (d < 0.004) {
      this.walking = false; this.frame = 0; this.aframe = 0; this.at = 0;
      if (this.plan) { this.act = this.plan; this.wait = this.pace ? 0.6 : 2; if (this.pace) this.faceTowards(this.gx, this.gy, 'campfire'); return; }
      this.act = null; this.wait = 2 + Math.random() * 5; this.dir = Math.random() < 0.6 ? 'front' : this.dir; return;
    }
    const step = Math.min(d, this.speed * dt);
    this.gx += dx / d * step; this.gy += dy / d * step;
    const [ax, ay] = toWorld(this.gx, this.gy), [bx, by] = toWorld(this.gx + dx / d * 0.01, this.gy + dy / d * 0.01);
    const sx = bx - ax, sy = by - ay, deg = Math.atan2(sy, sx) * 180 / Math.PI;
    if (deg > 50 && deg < 130) this.dir = 'front';
    else if (deg < -50 && deg > -130) this.dir = 'back';
    else { this.dir = 'side'; this.flip = sx < 0; }
    this.ft += dt; const fps = 9;
    if (this.ft > 1 / fps) { this.ft -= 1 / fps; this.frame = (this.frame + 1) % this.n[this.dir]; }
  }
  draw(now) {
    const [wx, wy] = toWorld(this.gx, this.gy);
    const s = SPR * 0.92;
    const carrying = this.walking && this.pace && this.dir === 'side';   // carrying wood to and fro: use the carry strip instead of the walk
    const act = this.act || (carrying ? 'carry' : null);
    let img, cw, ch, f, flip;
    if (act) { const a = this.acts[act]; img = IM[`${this.who}-${act}`]; [cw, ch] = a.cell; f = (carrying ? this.frame : this.aframe) % a.n; flip = this.flip; }
    else { img = IM[`${this.who}-${this.dir}`]; [cw, ch] = this.cell; f = this.walking ? this.frame : 0; flip = this.dir === 'side' && this.flip; }
    shadow(wx, wy, Math.min(cw, 150) * s * 0.45, Math.min(cw, 150) * s * 0.18);
    ctx.save(); ctx.translate(wx, wy);
    if (flip) ctx.scale(-1, 1);
    ctx.drawImage(img, f * cw, 0, cw, ch, -cw * s / 2, -ch * s, cw * s, ch * s);

function openSeedbed() {
  const p = G.plot(), c = C.crops.sprout; let body = '';
  if (!p.stage) body = `<div class="row"><div class="t"><b>Plant a seed</b><span>Costs ${costHtml(c.plant)} · ready about ${Math.round(c.grow / 60)} hours after watering</span></div><button class="act" data-a="plant" ${G.can(c.plant) ? '' : 'disabled'}>Plant</button></div>` + (G.can(c.plant) ? '' : `<p>No seeds. The land offers one now and then; look for a seed on the ground.</p>`);
  else if (p.stage === 'planted') body = `<div class="row"><div class="t"><b>It wants water</b><span>Costs ${costHtml({ water: 1 })} dew, gathered from the ground</span></div><button class="act" data-a="water" ${G.can({ water: 1 }) ? '' : 'disabled'}>Water</button></div>`;
  else if (p.stage === 'growing') { const tot = p.readyAt - p.wateredAt, pr = 1 - Math.max(0, p.readyAt - Date.now()) / tot; body = `<div class="row"><div class="t"><b>Growing</b><span>ready in ${G.timeLeft(p.readyAt)}</span><div class="prog"><i style="width:${(pr * 100).toFixed(0)}%"></i></div></div>${G.magicInfo().spells.includes('coax') ? `<button class="act" data-a="cast" data-id="coax" ${G.canCast('coax').ok ? '' : 'disabled'}>Coax ✨2</button>` : ''}</div>`; }
  else body = `<div class="row"><div class="t"><b>Ready to pick</b><span>Gives ${costHtml(c.harvest)} and a little more green</span></div><button class="act" data-a="harvest">Pick</button></div>`;
  openSheet('seedbed', `<h2>The seed bed<small>${p.grown} grown so far</small></h2>${body}`);
}
function hours(mins) { const h = mins / 60 * G.taskSpeed(); return h < 1 ? `${Math.round(h * 60)} minutes` : h < 1.75 ? 'about an hour' : `about ${Math.round(h)} hours`; }
function openPack() {
  let html = `<h2>Your pack<small>things gathered from the land</small></h2><p>Tap the glowing rings on the ground to pick things up. Jobs use them.</p><div class="pack">`;
  for (const [k, r] of Object.entries(C.resources)) { const n = G.s.inv[k] || 0; html += `<div class="${n ? '' : 'zero'}">${iconHtml(k)}<b>${n}</b>${r.name}</div>`; }
  openSheet('pack', html + `</div>`);
}
function openTasks(focus = '') {
  const list = G.taskList(); let html = `<h2>Jobs<small>give the materials; they do the work</small></h2>`;
  if (!list.length) html += `<p>Nothing to do right now. The gnomes are resting.</p>`;
  const groups = [['running', 'Happening now'], ['ready', 'You can start'], ['locked', 'Not yet'], ['done', 'Just finished']];
  for (const [state, title] of groups) {
    const rows = list.filter(v => v.state === state); if (!rows.length) continue;
    html += `<h3>${title}</h3>`;
    for (const v of rows) {
      const d = v.def, who = `<span class="who">${C.names[d.who]}</span>`;
      let right = '', sub = '';
      if (state === 'running') { const pr = 1 - Math.max(0, v.endsAt - Date.now()) / (v.endsAt - v.startedAt); sub = `${who} is on it · ${G.timeLeft(v.endsAt)} to go<div class="prog"><i style="width:${(pr * 100).toFixed(0)}%"></i></div>`; if (d.tile && G.magicInfo().spells.includes('wake')) right = `<button class="act" data-a="cast" data-id="wake" ${G.canCast('wake').ok ? '' : 'disabled'}>Wake ✨4</button>`; }
      else if (state === 'done') sub = `${who} finished this.`;
      else if (state === 'locked') sub = `${who} · <span class="bad">${v.why}</span>`;
      else { sub = (Object.keys(d.cost).length ? `${who} needs <span class="cost">${costHtml(d.cost)}</span>` : `${who} needs nothing but time`) + ` · ${hours(d.mins)}` + (v.can ? '' : `<br><span class="bad">You are short ${v.missing.join(', ')}.</span>`); right = `<button class="act" data-a="start" data-id="${d.id}" ${v.can ? '' : 'disabled'}>Start</button>`; }
      html += `<div class="row${d.id === focus ? ' hi' : ''}"><div class="t"><b>${d.name}</b><span>${d.blurb}</span><br><span>${sub}</span></div>${right}</div>`;
    }
  }
  openSheet('tasks:' + focus, html);
}
function openMagic() {
  const m = G.magicInfo(); let html = `<h2>Their magic<small>${m.name}</small></h2><div class="meter">${C.magicLevels.map((_, i) => `<i class="${i < m.level ? 'on' : ''}"></i>`).join('')}</div><p>It grows a little with every day you visit. Day ${m.days}${m.nextDays ? `; it will grow again on day ${m.nextDays}` : ''}. Spells burn ✨ light, which the land offers at night.</p>`;
  for (const [id, sp] of Object.entries(C.spells)) {
    const known = m.spells.includes(id), c = G.canCast(id);
    html += `<div class="row"><div class="t"><b>${sp.name} <span class="cost">${costHtml(sp.cost)}</span></b><span>${sp.blurb}</span>${known ? (c.ok ? '' : `<br><span class="bad">${c.why}</span>`) : `<br><span class="bad">not yet; comes with more days</span>`}</div>${known ? `<button class="act" data-a="cast" data-id="${id}" ${c.ok ? '' : 'disabled'}>Cast</button>` : ''}</div>`;
  }
  html += `<p style="margin-top:14px;font-size:12px">Save v${G.s.v} · ${new Date(G.s.created).toLocaleDateString()} · <a href="#" data-a="reset" style="color:var(--red)">start over</a></p>`;
  openSheet('magic', html);
}
const SIL = { robin:'🐦', mouse:'🐭', hedgehog:'🦔', owl:'🦉', ladybird:'🐞', spirit:'✨' };
function openJournal() {
  const j = G.s.journal, seen = Object.keys(j).length; let html = `<h2>Field journal<small>${seen} of ${C.visitors.length} met</small></h2><p>Tap a visitor in the garden to note it down. Some only come once there is something green.</p>`;
  for (const v of C.visitors) { const e = j[v.id]; html += `<div class="jrow ${e ? '' : 'unseen'}"><div class="sil">${v.icon || SIL[v.id]}</div><div class="t"><b>${e ? v.name : '?'}</b><span>${e ? `${v.note} First seen ${new Date(e.first).toLocaleDateString()}; met ${e.count}×.` : 'not met yet'}</span></div></div>`; }
  const log = [...G.s.log].reverse().slice(0, 8);
  if (log.length) html += `<h2 style="margin-top:14px">Lately</h2>` + log.map(l => `<p style="margin:2px 0">${l.text}</p>`).join('');
  openSheet('journal', html);
}
function openAway(r) {
  const mins = Math.round(r.gone / 60000); if (mins < 10 && !r.finished.length) return;
  const gone = mins < 60 ? `${mins} minutes` : mins < 60 * 36 ? `${Math.round(mins / 60)} hours` : `${Math.round(mins / 1440)} days`;
  let html = `<h2>While you were away<small>${gone}</small></h2>`;
  if (r.event) html += `<p>${r.event}</p>`;
  if (r.newDay) html += `<p>A new day. Their magic has grown a little: ${G.magicInfo().name}.</p>`;
  if (r.offered) html += `<p>The land has left ${r.offered} thing${r.offered > 1 ? 's' : ''} for you to gather.</p>`;
  for (const f of r.finished) html += `<p>✓ ${f}</p>`;
  if (!r.offered && !r.finished.length && !r.newDay) html += `<p>Quiet. The fire kept going.</p>`;
  openSheet('away', html + `<p style="margin-top:10px"><button class="act" data-a="close">Have a look</button></p>`);
}
$('bPack').onclick = openPack; $('bTasks').onclick = () => openTasks(); $('bMagic').onclick = openMagic; $('bJournal').onclick = openJournal;
G.onChange((kind, data) => { renderInv(kind === 'inv' && typeof data === 'string' ? data : null); renderHud(); if (kind === 'task' && data && data.done) { toast('Finished: ' + G.taskDef(data.id).name.toLowerCase() + '.'); } if (kind === 'event') toast(data.text); if (kind === 'land') toast(`The home patch is now ${data.name}.`); });

// ---------- start ----------
function start() {
  G.boot();
  document.getElementById('load').remove();
  gnomes.push(new Gnome('him', 0.46, 0.50), new Gnome('her', 0.40, 0.40));
  gnomes[1].wait = 0.5;
  cam.z = clampZ(G.s.flags.welcomed ? Math.max(1.5, minZ * 2.4) : 0.95);   // first visit: far enough out to see the whole yard
  [cam.x, cam.y] = G.s.flags.welcomed ? toWorld((gnomes[0].gx + gnomes[1].gx) / 2, (gnomes[0].gy + gnomes[1].gy) / 2) : toWorld(0.5, 0.5); clampCam();
  renderInv(); renderHud();
  const [a, b] = C.visitorEvery; nextVisitorAt = performance.now() + (G.FAST ? 5 : 25 + Math.random() * 30) * 1000;
  if (/vis=(\w+)/.test(hash)) { const id = RegExp.$1; const def = C.visitors.find(v => v.id === id); if (def) { spawnVisitor(); if (visitor) visitor.def = def; } }
  requestAnimationFrame(frame);
  if (G.away) openAway(G.away);
  if (!G.s.flags.welcomed) {
    G.s.flags.welcomed = true; G.save();
    openSheet('welcome', `<h2>Welcome to the garden</h2><p>Wendel and Hazel, two small gnomes, have just arrived in this logged clearing. You are their unseen helper spirit.</p><h3>How it works</h3><p>✨ <b>Touch the glowing rings.</b> Things lying on the ground go into your pack (🧺 Pack).</p><p>🔨 <b>Rings on their belongings mean a job you can start.</b> Give the materials and a gnome gets to work while you go about your day.</p><p>Come back whenever you like: the land leaves something new for you each time.</p><p style="margin-top:12px"><button class="act" data-a="close">Let's begin</button></p>`);
  }
}
})();
</script>
