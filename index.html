<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1c2418">
<title>Gnome Life</title>
<style>
  :root { --paper:#f3e9d2; --paper2:#e6d9bd; --ink:#2b2418; --ink2:#6b5a44; --green:#5b6b2d; --red:#b14c37; --safe-b: env(safe-area-inset-bottom); }
  html,body { margin:0; height:100%; background:#1c2418; overflow:hidden; -webkit-user-select:none; user-select:none; touch-action:none; font-family: Georgia, "Times New Roman", serif; -webkit-tap-highlight-color: transparent; }
  canvas { display:block; width:100vw; height:100vh; }
  #hud { position:fixed; left:0; right:0; top:0; padding: calc(env(safe-area-inset-top) + 10px) 14px 0; pointer-events:none; color:var(--paper); text-shadow:0 1px 2px rgba(0,0,0,.6); }
  #hud h1 { margin:0; font-size:19px; font-weight:normal; letter-spacing:.5px; }
  #hud p { margin:2px 0 0; font-size:12px; opacity:.85; }
  #bubble { position:fixed; max-width:62vw; background:var(--paper); color:var(--ink); border-radius:14px; padding:8px 12px; font-size:14px; line-height:1.3; box-shadow:0 2px 8px rgba(0,0,0,.35); pointer-events:none; opacity:0; transition:opacity .25s; transform:translate(-50%,-100%); }
  #bubble:after { content:""; position:absolute; left:50%; bottom:-8px; margin-left:-7px; border:7px solid transparent; border-top-color:var(--paper); border-bottom:0; }
  #load { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; color:var(--paper); font-size:15px; background:#1c2418; z-index:9; }
  /* bottom bar */
  #bar { position:fixed; left:0; right:0; bottom:0; padding: 8px 10px calc(var(--safe-b) + 8px); display:flex; flex-direction:column; gap:7px; pointer-events:none; }
  #inv { display:flex; gap:5px; flex-wrap:wrap; justify-content:center; }
  .chip { background:rgba(243,233,210,.92); color:var(--ink); border-radius:999px; padding:3px 9px 3px 6px; font-size:13px; display:flex; gap:4px; align-items:center; box-shadow:0 1px 3px rgba(0,0,0,.3); transition:transform .15s; }
  .chip.zero { opacity:.45; } .chip.pop { transform:scale(1.25); }
  #btns { display:flex; gap:8px; justify-content:center; pointer-events:auto; }
  .btn { background:var(--paper); color:var(--ink); border:0; border-radius:12px; padding:9px 14px; font:inherit; font-size:14px; box-shadow:0 2px 6px rgba(0,0,0,.35); position:relative; }
  .btn .dot { position:absolute; top:-4px; right:-4px; width:12px; height:12px; border-radius:50%; background:var(--red); border:2px solid var(--paper); display:none; }
  .btn.alert .dot { display:block; }
  .btn.ghost { background:rgba(243,233,210,.25); color:var(--paper); }
  /* sheet */
  #shade { position:fixed; inset:0; background:rgba(10,14,8,.35); opacity:0; pointer-events:none; transition:opacity .2s; }
  #shade.on { opacity:1; pointer-events:auto; }
  #sheet { position:fixed; left:0; right:0; bottom:0; max-height:72vh; background:var(--paper); color:var(--ink); border-radius:18px 18px 0 0; padding:14px 16px calc(var(--safe-b) + 16px); box-shadow:0 -4px 18px rgba(0,0,0,.4); transform:translateY(105%); transition:transform .25s; overflow-y:auto; touch-action:pan-y; pointer-events:auto; }
  #sheet.on { transform:none; }
  #sheet h2 { margin:0 0 4px; font-size:18px; font-weight:normal; }
  #sheet h2 small { font-size:12px; color:var(--ink2); margin-left:6px; }
  #sheet p { margin:4px 0 8px; font-size:14px; line-height:1.35; color:var(--ink2); }
  .row { display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid rgba(43,36,24,.12); }
  .row:first-of-type { border-top:0; }
  .row .t { flex:1; min-width:0; } .row .t b { font-weight:normal; font-size:15px; display:block; } .row .t span { font-size:12.5px; color:var(--ink2); }
  .row .t span.bad { color:var(--red); }
  .act { background:var(--green); color:var(--paper); border:0; border-radius:10px; padding:8px 12px; font:inherit; font-size:13.5px; white-space:nowrap; }
  .act[disabled] { background:var(--paper2); color:var(--ink2); }
  .act.quiet { background:var(--paper2); color:var(--ink); }
  .cost { font-size:13px; } .cost i { font-style:normal; margin-right:6px; }
  .prog { height:5px; background:var(--paper2); border-radius:3px; overflow:hidden; margin-top:5px; } .prog i { display:block; height:100%; background:var(--green); }
  .meter { display:flex; gap:4px; margin:6px 0 10px; } .meter i { flex:1; height:8px; border-radius:4px; background:var(--paper2); } .meter i.on { background:#c9922e; box-shadow:0 0 6px #ffcf6a; }
  .jrow { display:flex; align-items:center; gap:10px; padding:8px 0; border-top:1px solid rgba(43,36,24,.12); }
  .jrow .sil { width:34px; height:34px; border-radius:50%; background:var(--paper2); display:flex; align-items:center; justify-content:center; font-size:18px; }
  .jrow.unseen .sil { filter:grayscale(1); opacity:.5; }
  .jrow .t b { font-weight:normal; display:block; font-size:15px; } .jrow .t span { font-size:12.5px; color:var(--ink2); }
  .close { position:absolute; right:12px; top:10px; background:none; border:0; font:inherit; font-size:22px; color:var(--ink2); }
  #toast { position:fixed; left:50%; top:calc(env(safe-area-inset-top) + 58px); transform:translateX(-50%); background:rgba(243,233,210,.95); color:var(--ink); border-radius:12px; padding:8px 14px; font-size:14px; opacity:0; transition:opacity .25s; pointer-events:none; max-width:80vw; text-align:center; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><h1>Gnome Life</h1><p id="sub"></p></div>
<div id="bubble"></div>
<div id="toast"></div>
<div id="bar">
  <div id="inv"></div>
  <div id="btns">
    <button class="btn" id="bTasks">Tasks<i class="dot"></i></button>
    <button class="btn" id="bMagic">Magic<i class="dot"></i></button>
    <button class="btn" id="bJournal">Journal<i class="dot"></i></button>
  </div>
</div>
<div id="shade"></div>
<div id="sheet"></div>
<div id="load">waking the garden…</div>
<script src="content.js"></script>
<script src="game.js"></script>
<script>
(() => {
const C = window.CONTENT, G = window.GL;
const SPR = 0.5;
const PLOT = { w:1225, h:728, top:[612,1], left:[3,346], right:[1221,347], bottom:[612,691] };
const EX = [PLOT.right[0]-PLOT.top[0], PLOT.right[1]-PLOT.top[1]];   // one tile east
const EY = [PLOT.left[0]-PLOT.top[0],  PLOT.left[1]-PLOT.top[1]];    // one tile south
const ASSETS = {
  plot:'sprites/plot-barren.webp',
  shelter:'sprites/shelter.webp', campfire:'sprites/campfire.webp', firewood:'sprites/firewood.webp',
  barrel:'sprites/barrel.webp', seedbed:'sprites/seedbed.webp', stonebench:'sprites/stonebench.webp',
  tub:'sprites/tub.webp', lanternstump:'sprites/lanternstump.webp', wheelbarrow:'sprites/wheelbarrow.webp',
  fence:'sprites/fence.webp', sapling:'sprites/sapling.webp',
  'him-side':'sprites/him-side.png','him-front':'sprites/him-front.png','him-back':'sprites/him-back.png',
  'her-side':'sprites/her-side.png','her-front':'sprites/her-front.png','her-back':'sprites/her-back.png',
};
const GNOMES = {"him": {"cell": [109, 242], "dirs": {"side": 10, "front": 6, "back": 6}}, "her": {"cell": [137, 242], "dirs": {"side": 10, "front": 6, "back": 6}}};

// ---------- world helpers ----------
function tileOrigin(k) { const [tx, ty] = k.split(',').map(Number); return [tx*EX[0] + ty*EY[0], tx*EX[1] + ty*EY[1]]; }
function toWorld(gx, gy, tile = '0,0') {         // tile grid (0..1, 0..1) -> world pixel coords
  const [ox, oy] = tileOrigin(tile), [tx, ty] = PLOT.top, [rx, ry] = PLOT.right, [lx, ly] = PLOT.left;
  return [ox + tx + gx * (rx - tx) + gy * (lx - tx), oy + ty + gx * (ry - ty) + gy * (ly - ty)];
}
function fromWorld(wx, wy) {                       // world pixel -> { tile, gx, gy } (any tile, may be outside 0..1)
  const [tx, ty] = PLOT.top, a = PLOT.right[0]-tx, b = PLOT.left[0]-tx, c = PLOT.right[1]-ty, d = PLOT.left[1]-ty;
  const det = a*d - b*c, px = wx - tx, py = wy - ty;
  const u = (px*d - b*py) / det, v = (a*py - c*px) / det;           // continuous tile coords
  const txi = Math.floor(u), tyi = Math.floor(v);
  return { tile: `${txi},${tyi}`, gx: u - txi, gy: v - tyi };
}
function depthOf(gx, gy, tile = '0,0') { const [tx, ty] = tile.split(',').map(Number); return gx + gy + tx + ty; }

// ---------- scene content (home tile) ----------
const PROPS = [
  { name:'shelter',      gx:0.30, gy:0.22, s:1.0 },
  { name:'firewood',     gx:0.14, gy:0.40, s:0.9 },
  { name:'barrel',       gx:0.40, gy:0.42, s:0.9 },
  { name:'campfire',     gx:0.52, gy:0.44, s:0.9 },
  { name:'stonebench',   gx:0.66, gy:0.30, s:0.9 },
  { name:'lanternstump', gx:0.78, gy:0.50, s:0.9 },
  { name:'seedbed',      gx:0.60, gy:0.70, s:1.0, flat:true },
  { name:'tub',          gx:0.44, gy:0.76, s:0.85 },
  { name:'wheelbarrow',  gx:0.26, gy:0.62, s:0.9 },
  { name:'fence',        gx:0.86, gy:0.78, s:0.9 },
  { name:'sapling',      gx:0.72, gy:0.86, s:0.8 },
];
const SPOTS = {   // places the gnomes like to go (home tile)
  door:[0.36,0.33], fire:[0.46,0.52], bench:[0.62,0.36], bed:[0.56,0.66], barrel:[0.46,0.44],
  tub:[0.40,0.72], sprout:[0.50,0.52], barrow:[0.32,0.66], lantern:[0.72,0.56], fence:[0.80,0.72]
};
const WORKSPOT = { wheelbarrow:[0.30,0.68], shelter:[0.38,0.30], fence:[0.80,0.74], sapling:[0.66,0.84], stonebench:[0.60,0.36], seedbed:[0.54,0.66] };

// ---------- loading ----------
const IM = {};
let loaded = 0; const total = Object.keys(ASSETS).length;
for (const [k, src] of Object.entries(ASSETS)) {
  const im = new Image(); im.onload = im.onerror = () => { if (++loaded === total) start(); }; im.src = src; IM[k] = im;
}

// ---------- state ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const bubble = document.getElementById('bubble'), toastEl = document.getElementById('toast');
let W = 0, H = 0, DPR = 1;
const cam = { x: PLOT.w/2, y: PLOT.h/2 - 40, z: 1 };
let minZ = 0.4, maxZ = 4;
const gnomes = [], particles = [], floaters = [];
let visitor = null, nextVisitorAt = 0;
let tod = null;
const hash = location.hash.slice(1);
for (const tok of hash.split(/[#&]/)) if (/^(day|night|dawn|dusk)$/.test(tok)) tod = tok;
if (/reset/.test(hash)) { G.reset(); }
window.addEventListener('hashchange', () => location.reload());

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  minZ = Math.max(0.2, Math.min(W / (PLOT.w + 80), H / (PLOT.h + 160)) * 0.95);
  cam.z = Math.max(cam.z, minZ);
}
window.addEventListener('resize', resize); resize();

// ---------- gnomes ----------
class Gnome {
  constructor(who, gx, gy) {
    this.who = who; this.gx = gx; this.gy = gy; this.tx = gx; this.ty = gy;
    this.cell = GNOMES[who].cell; this.n = GNOMES[who].dirs;
    this.dir = 'front'; this.flip = false; this.walking = false; this.frame = 0; this.ft = 0;
    this.wait = 1 + Math.random() * 2; this.speed = 0.055 + Math.random() * 0.01;
    this.say = null; this.sayT = 0; this.job = null; this.bob = 0;
  }
  goto(x, y) { this.tx = x; this.ty = y; this.walking = true; }
  pick() {
    const job = G.running().find(r => r.def.who === this.who);
    if (job) { const sp = WORKSPOT[job.def.spot] || SPOTS.fire; this.job = job.id; this.goto(sp[0] + (job.def.tile ? 0 : 0), sp[1]); return; }
    this.job = null;
    const keys = Object.keys(SPOTS); const [sx, sy] = SPOTS[keys[(Math.random() * keys.length) | 0]];
    this.goto(sx + (Math.random() - 0.5) * 0.08, sy + (Math.random() - 0.5) * 0.08);
  }
  update(dt) {
    if (this.sayT > 0) this.sayT -= dt;
    if (!this.walking) {
      this.wait -= dt;
      if (this.job) { this.bob += dt * 6; const still = G.running().some(r => r.id === this.job); if (!still) { this.job = null; this.wait = 0.5; } else if (this.wait <= 0) this.wait = 1; return; }
      if (this.wait <= 0) this.pick();
      return;
    }
    const dx = this.tx - this.gx, dy = this.ty - this.gy, d = Math.hypot(dx, dy);
    if (d < 0.004) { this.walking = false; this.wait = 2 + Math.random() * 5; this.frame = 0; this.dir = this.job ? 'front' : (Math.random() < 0.6 ? 'front' : this.dir); return; }
    const step = Math.min(d, this.speed * dt);
    this.gx += dx / d * step; this.gy += dy / d * step;
    const [ax, ay] = toWorld(this.gx, this.gy), [bx, by] = toWorld(this.gx + dx / d * 0.01, this.gy + dy / d * 0.01);
    const sx = bx - ax, sy = by - ay, deg = Math.atan2(sy, sx) * 180 / Math.PI;
    if (deg > 50 && deg < 130) this.dir = 'front';
    else if (deg < -50 && deg > -130) this.dir = 'back';
    else { this.dir = 'side'; this.flip = sx < 0; }
    this.ft += dt; const fps = 9;
    if (this.ft > 1 / fps) { this.ft -= 1 / fps; this.frame = (this.frame + 1) % this.n[this.dir]; }
  }
  draw() {
    const img = IM[`${this.who}-${this.dir}`]; const [cw, ch] = this.cell;
    const f = this.walking ? this.frame : 0;
    const [wx, wy] = toWorld(this.gx, this.gy);
    const s = SPR * 0.92, bob = this.job && !this.walking ? Math.abs(Math.sin(this.bob)) * 3 : 0;
    shadow(wx, wy, cw * s * 0.45, cw * s * 0.18);
    ctx.save(); ctx.translate(wx, wy - bob);
    if (this.dir === 'side' && this.flip) ctx.scale(-1, 1);
    ctx.drawImage(img, f * cw, 0, cw, ch, -cw * s / 2, -ch * s, cw * s, ch * s);
    ctx.restore();
    this.screen = { x: wx, y: wy, w: cw * s, h: ch * s };
  }
}
function shadow(x, y, rx, ry) {
  ctx.save(); ctx.globalAlpha = 0.28; ctx.fillStyle = '#1a1408';
  ctx.beginPath(); ctx.ellipse(x, y + 2, rx, ry, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
}

// ---------- time of day ----------
function dayPhase() {
  let h;
  if (tod === 'day') h = 13; else if (tod === 'night') h = 1; else if (tod === 'dawn') h = 6.3; else if (tod === 'dusk') h = 18.6;
  else { const d = new Date(); h = d.getHours() + d.getMinutes() / 60; }
  let light;
  if (h >= 8 && h <= 17) light = 1; else if (h > 17 && h < 20) light = 1 - (h - 17) / 3; else if (h >= 5 && h < 8) light = (h - 5) / 3; else light = 0;
  const warm = (h > 16.5 && h < 19.5) || (h > 5.5 && h < 8.5) ? 1 - Math.abs(((h > 12 ? 18 : 7) - h)) / 1.5 : 0;
  return { h, light, warm: Math.max(0, Math.min(1, warm)) };
}

// ---------- particles ----------
function spawnParticles(dt, ph) {
  const fire = PROPS.find(p => p.name === 'campfire'); const [fx, fy] = toWorld(fire.gx, fire.gy);
  if (Math.random() < dt * 6) particles.push({ k:'smoke', x: fx + (Math.random()-0.5)*6, y: fy - 60*SPR*1.8, vx:(Math.random()-0.5)*4, vy:-14-Math.random()*8, r:4+Math.random()*4, life:0, max:3.5+Math.random()*2 });
  if (Math.random() < dt * 5) particles.push({ k:'spark', x: fx + (Math.random()-0.5)*10, y: fy - 50*SPR*1.4, vx:(Math.random()-0.5)*10, vy:-25-Math.random()*20, life:0, max:0.8+Math.random()*0.8 });
  if (ph.light < 0.35 && particles.filter(p => p.k === 'fly').length < 18 && Math.random() < dt * 1.5) {
    const [x, y] = toWorld(Math.random(), Math.random());
    particles.push({ k:'fly', x, y: y - 20 - Math.random()*60, vx:0, vy:0, ph:Math.random()*6, life:0, max:12+Math.random()*10 });
  }
  if (ph.light > 0.5 && Math.random() < dt * 0.8) {
    const [x, y] = toWorld(Math.random(), Math.random());
    particles.push({ k:'mote', x, y: y - Math.random()*120, vx:6+Math.random()*6, vy:-2+Math.random()*4, life:0, max:8 });
  }
  // work puffs where a gnome is busy
  for (const g of gnomes) if (g.job && !g.walking && Math.random() < dt * 2) { const [x, y] = toWorld(g.gx, g.gy); particles.push({ k:'puff', x: x + (Math.random()-0.5)*30, y: y - 10, vx:(Math.random()-0.5)*6, vy:-6, r:3, life:0, max:1.2 }); }
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]; p.life += dt;
    if (p.life > p.max) { particles.splice(i, 1); continue; }
    if (p.k === 'fly') { p.ph += dt; p.x += Math.sin(p.ph * 1.3) * 12 * dt; p.y += Math.cos(p.ph * 0.9) * 8 * dt; }
    else { p.x += p.vx * dt; p.y += p.vy * dt; if (p.k === 'smoke' || p.k === 'puff') { p.vx += (Math.random()-0.5)*8*dt; p.r += 6*dt; } if (p.k === 'spark') p.vy += 10*dt; }
  }
  for (let i = floaters.length - 1; i >= 0; i--) { const f = floaters[i]; f.life += dt; f.y -= 28 * dt; if (f.life > 1.4) floaters.splice(i, 1); }
}
function drawParticles(ph) {
  for (const p of particles) {
    const t = p.life / p.max;
    if (p.k === 'smoke' || p.k === 'puff') { ctx.globalAlpha = 0.18 * (1 - t); ctx.fillStyle = p.k === 'puff' ? '#c9b58f' : '#d9d2c4'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); }
    else if (p.k === 'spark') { ctx.globalAlpha = 0.9 * (1 - t); ctx.fillStyle = '#ffb347'; ctx.fillRect(p.x, p.y, 2, 2); }
    else if (p.k === 'fly') { const a = (0.5 + 0.5 * Math.sin(p.ph * 4)) * Math.min(1, t * 4, (1 - t) * 4); ctx.globalAlpha = a; ctx.fillStyle = '#e8ff9a'; ctx.shadowColor = '#d8ff70'; ctx.shadowBlur = 8; ctx.beginPath(); ctx.arc(p.x, p.y, 1.8, 0, 7); ctx.fill(); ctx.shadowBlur = 0; }
    else if (p.k === 'mote') { ctx.globalAlpha = 0.35 * Math.sin(Math.PI * t) * ph.light; ctx.fillStyle = '#fff6d0'; ctx.beginPath(); ctx.arc(p.x, p.y, 1.5, 0, 7); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
  for (const f of floaters) { ctx.globalAlpha = 1 - f.life / 1.4; ctx.font = '600 22px Georgia'; ctx.textAlign = 'center'; ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(30,22,12,.6)'; ctx.strokeText(f.text, f.x, f.y); ctx.fillStyle = '#f3e9d2'; ctx.fillText(f.text, f.x, f.y); }
  ctx.globalAlpha = 1;
}
function float(text, x, y) { floaters.push({ text, x, y: y - 40, life: 0 }); }

// ---------- drawing ----------
function glow(x, y, r, color, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, color); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = a; ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.restore();
}
function diamondPath(tile) {
  const [ox, oy] = tileOrigin(tile);
  ctx.beginPath(); ctx.moveTo(ox + PLOT.top[0], oy + PLOT.top[1]); ctx.lineTo(ox + PLOT.right[0], oy + PLOT.right[1]); ctx.lineTo(ox + PLOT.bottom[0], oy + PLOT.bottom[1]); ctx.lineTo(ox + PLOT.left[0], oy + PLOT.left[1]); ctx.closePath();
}
const GREEN_ALPHA = { barren: 0, green: 0.16, meadow: 0.30, wood: 0.40 };
function drawTile(k, tl, now) {
  const [ox, oy] = tileOrigin(k);
  ctx.drawImage(IM.plot, ox, oy);
  // placeholder regrowth: a green wash over the bare slab until the painted tile set exists
  let a = 0;
  if (k === '0,0') a = GREEN_ALPHA[G.landStage().key];
  else if (tl.state === 'green') a = 0.22;
  else if (tl.state === 'regrowing') { const tk = G.s.tasks['regrow:' + k]; const p = tk ? 1 - Math.max(0, tk.endsAt - Date.now()) / (tk.endsAt - tk.startedAt) : 0; a = 0.05 + 0.15 * p + 0.03 * Math.sin(now / 500); }
  if (a > 0) { ctx.save(); diamondPath(k); ctx.clip(); ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = `rgba(120,150,70,${a * 1.6})`; ctx.fillRect(ox, oy, PLOT.w, PLOT.h); ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = `rgba(140,170,80,${a * 0.5})`; ctx.fillRect(ox, oy, PLOT.w, PLOT.h); ctx.restore(); }

    html += `<div class="row"><div class="t"><b>${sp.name} <span class="cost">${costHtml(sp.cost)}</span></b><span>${sp.blurb}</span>${known ? (c.ok ? '' : `<br><span class="bad">${c.why}</span>`) : `<br><span class="bad">not yet; comes with more days</span>`}</div>${known ? `<button class="act" data-a="cast" data-id="${id}" ${c.ok ? '' : 'disabled'}>Cast</button>` : ''}</div>`;

  html += `<p style="margin-top:14px;font-size:12px">Save v${G.s.v} · ${new Date(G.s.created).toLocaleDateString()} · <a href="#" data-a="reset" style="color:var(--red)">start over</a></p>`;
  openSheet('magic', html);
}
const SIL = { robin:'🐦', mouse:'🐭', hedgehog:'🦔', owl:'🦉', ladybird:'🐞', spirit:'✨' };
function openJournal() {
  const j = G.s.journal, seen = Object.keys(j).length; let html = `<h2>Field journal<small>${seen} of ${C.visitors.length} met</small></h2><p>Tap a visitor in the garden to note it down. Some only come once there is something green.</p>`;
  for (const v of C.visitors) { const e = j[v.id]; html += `<div class="jrow ${e ? '' : 'unseen'}"><div class="sil">${v.icon || SIL[v.id]}</div><div class="t"><b>${e ? v.name : '?'}</b><span>${e ? `${v.note} First seen ${new Date(e.first).toLocaleDateString()}; met ${e.count}×.` : 'not met yet'}</span></div></div>`; }
  const log = [...G.s.log].reverse().slice(0, 8);
  if (log.length) html += `<h2 style="margin-top:14px">Lately</h2>` + log.map(l => `<p style="margin:2px 0">${l.text}</p>`).join('');
  openSheet('journal', html);
}
function openAway(r) {
  const mins = Math.round(r.gone / 60000); if (mins < 10 && !r.finished.length) return;
  const gone = mins < 60 ? `${mins} minutes` : mins < 60 * 36 ? `${Math.round(mins / 60)} hours` : `${Math.round(mins / 1440)} days`;
  let html = `<h2>While you were away<small>${gone}</small></h2>`;
  if (r.event) html += `<p>${r.event}</p>`;
  if (r.newDay) html += `<p>A new day. Their magic has grown a little: ${G.magicInfo().name}.</p>`;
  if (r.offered) html += `<p>The land has left ${r.offered} thing${r.offered > 1 ? 's' : ''} for you to gather.</p>`;
  for (const f of r.finished) html += `<p>✓ ${f}</p>`;
  if (!r.offered && !r.finished.length && !r.newDay) html += `<p>Quiet. The fire kept going.</p>`;
  openSheet('away', html + `<p style="margin-top:10px"><button class="act" data-a="close">Have a look</button></p>`);
}
$('bTasks').onclick = () => openTasks(); $('bMagic').onclick = openMagic; $('bJournal').onclick = openJournal;
G.onChange((kind, data) => { renderInv(kind === 'inv' && typeof data === 'string' ? data : null); renderHud(); if (kind === 'task' && data && data.done) { toast('Finished: ' + G.taskDef(data.id).name.toLowerCase() + '.'); } if (kind === 'event') toast(data.text); if (kind === 'land') toast(`The home patch is now ${data.name}.`); });

// ---------- start ----------
function start() {
  G.boot();
  document.getElementById('load').remove();
  gnomes.push(new Gnome('him', 0.46, 0.50), new Gnome('her', 0.40, 0.40));
  gnomes[1].wait = 0.5;
  cam.z = clampZ(Math.max(1.5, minZ * 2.4));
  [cam.x, cam.y] = toWorld((gnomes[0].gx + gnomes[1].gx) / 2, (gnomes[0].gy + gnomes[1].gy) / 2); clampCam();
  renderInv(); renderHud();
  const [a, b] = C.visitorEvery; nextVisitorAt = performance.now() + (G.FAST ? 5 : 25 + Math.random() * 30) * 1000;
  if (/vis=(\w+)/.test(hash)) { const id = RegExp.$1; const def = C.visitors.find(v => v.id === id); if (def) { spawnVisitor(); if (visitor) visitor.def = def; } }
  requestAnimationFrame(frame);
  if (G.away) openAway(G.away);
}
})();
</script>
