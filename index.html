<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1c2418">
<title>Gnome Life</title>
<style>
  :root { --paper:#f3e9d2; --paper2:#e6d9bd; --ink:#2b2418; --ink2:#6b5a44; --green:#5b6b2d; --red:#b14c37; --safe-b: env(safe-area-inset-bottom); }
  html,body { margin:0; height:100%; background:#1c2418; overflow:hidden; -webkit-user-select:none; user-select:none; touch-action:none; font-family: Georgia, "Times New Roman", serif; -webkit-tap-highlight-color: transparent; }
  canvas { display:block; width:100vw; height:100vh; }
  #hud { position:fixed; left:0; right:0; top:0; padding: calc(env(safe-area-inset-top) + 10px) 14px 0; pointer-events:none; color:var(--paper); text-shadow:0 1px 2px rgba(0,0,0,.6); }
  #hud h1 { margin:0; font-size:22px; font-weight:bold; letter-spacing:.5px; }
  #hud p { margin:3px 0 0; font-size:15px; opacity:.92; line-height:1.3; }
  #hud p.busy { font-size:14px; opacity:.85; }
  #bubble { position:fixed; max-width:66vw; background:var(--paper); color:var(--ink); border-radius:14px; padding:10px 14px; font-size:16px; line-height:1.3; box-shadow:0 2px 8px rgba(0,0,0,.35); pointer-events:none; opacity:0; transition:opacity .25s; transform:translate(-50%,-100%); }
  #bubble:after { content:""; position:absolute; left:50%; bottom:-8px; margin-left:-7px; border:7px solid transparent; border-top-color:var(--paper); border-bottom:0; }
  #load { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; color:var(--paper); font-size:15px; background:#1c2418; z-index:9; }
  /* bottom bar */
  #bar { position:fixed; left:0; right:0; bottom:0; padding: 8px 10px calc(var(--safe-b) + 10px); display:flex; flex-direction:column; gap:7px; pointer-events:none; }
  .ico { width:22px; height:22px; vertical-align:middle; margin-right:3px; }
  #btns { display:flex; gap:8px; justify-content:center; pointer-events:auto; }
  .btn { flex:1; max-width:110px; min-height:60px; background:var(--paper); color:var(--ink); border:0; border-radius:16px; padding:7px 4px 6px; font:inherit; font-size:14px; font-weight:bold; letter-spacing:.2px; box-shadow:0 3px 8px rgba(0,0,0,.4), inset 0 -3px 0 rgba(43,36,24,.12); position:relative; display:flex; flex-direction:column; align-items:center; gap:3px; }
  .btn:active { transform:translateY(2px); box-shadow:0 1px 4px rgba(0,0,0,.4); }
  .btn .ic { font-size:26px; line-height:1; }
  .btn .ic img { width:34px; height:34px; object-fit:contain; display:block; }
  .btn .dot { position:absolute; top:-5px; right:-5px; min-width:14px; height:18px; padding:0 4px; border-radius:9px; background:var(--red); color:var(--paper); border:2px solid var(--paper); display:none; font-size:12px; line-height:18px; text-align:center; }
  .btn.alert .dot { display:block; }
  #bPack .dot { background:var(--green); }
  .btn.pop { transform:scale(1.07); }
  /* sheet */
  #shade { position:fixed; inset:0; background:rgba(10,14,8,.35); opacity:0; pointer-events:none; transition:opacity .2s; }
  #shade.on { opacity:1; pointer-events:auto; }
  #sheet { position:fixed; left:0; right:0; bottom:0; max-height:76vh; background:var(--paper); color:var(--ink); border-radius:20px 20px 0 0; padding:16px 18px calc(var(--safe-b) + 18px); box-shadow:0 -4px 18px rgba(0,0,0,.4); transform:translateY(105%); transition:transform .25s; overflow-y:auto; touch-action:pan-y; pointer-events:auto; }
  #sheet.on { transform:none; }
  #sheet h2 { margin:0 0 6px; font-size:23px; font-weight:bold; padding-right:40px; }
  #sheet h2 small { font-size:14px; color:var(--ink2); margin-left:8px; font-weight:normal; }
  #sheet h3 { margin:16px 0 2px; font-size:14px; font-weight:bold; text-transform:uppercase; letter-spacing:1px; color:var(--ink2); }
  #sheet h3:first-of-type { margin-top:6px; }
  #sheet p { margin:6px 0 10px; font-size:16px; line-height:1.4; color:var(--ink2); }
  .row { display:flex; align-items:center; gap:12px; padding:11px 0; border-top:1px solid rgba(43,36,24,.12); }
  .row.hi { background:rgba(91,107,45,.1); margin:0 -10px; padding:11px 10px; border-radius:10px; border-top:0; }
  .row .t { flex:1; min-width:0; } .row .t b { font-weight:bold; font-size:17px; display:block; line-height:1.25; } .row .t span { font-size:14.5px; color:var(--ink2); line-height:1.35; }
  .row .t span.bad { color:var(--red); }
  .row .t .who { display:inline-block; background:rgba(91,107,45,.14); color:var(--green); font-weight:bold; font-size:13px; border-radius:6px; padding:1px 6px; margin-right:4px; }
  .act { background:var(--green); color:var(--paper); border:0; border-radius:12px; padding:12px 16px; min-height:46px; font:inherit; font-size:16px; font-weight:bold; white-space:nowrap; box-shadow:inset 0 -3px 0 rgba(0,0,0,.18); }
  .act:active { transform:translateY(1px); }
  .act[disabled] { background:var(--paper2); color:var(--ink2); box-shadow:none; }
  .act.quiet { background:var(--paper2); color:var(--ink); }
  .cost { font-size:14px; } .cost i { font-style:normal; margin-right:7px; white-space:nowrap; }
  .prog { height:7px; background:var(--paper2); border-radius:4px; overflow:hidden; margin-top:6px; } .prog i { display:block; height:100%; background:var(--green); }
  .meter { display:flex; gap:4px; margin:6px 0 10px; } .meter i { flex:1; height:10px; border-radius:5px; background:var(--paper2); } .meter i.on { background:#c9922e; box-shadow:0 0 6px #ffcf6a; }
  .jgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(92px, 1fr)); gap:10px; margin:10px 0 4px; }
  .jcard { background:var(--paper2); border:0; border-radius:14px; padding:9px 4px 8px; font:inherit; color:var(--ink); display:flex; flex-direction:column; align-items:center; gap:4px; box-shadow:inset 0 -2px 0 rgba(43,36,24,.1); }
  .jcard b { font-size:13.5px; line-height:1.2; text-align:center; } .jcard i { font-style:normal; font-size:11.5px; color:var(--green); font-weight:bold; }
  .jcard.unseen .por img, .jcard.unseen .por span { filter:brightness(0); opacity:.22; } .jcard.unseen b { color:var(--ink2); }
  .por { width:64px; height:64px; border-radius:50%; background:radial-gradient(circle at 50% 40%, #fbf4e2, #e2d3b2); border:2px solid rgba(107,90,68,.45); overflow:hidden; display:flex; align-items:center; justify-content:center; flex:none; }
  .por img { width:100%; height:100%; object-fit:cover; } .por.pad img { object-fit:contain; padding:6px; box-sizing:border-box; } .por span { font-size:34px; }
  .por.big { width:140px; height:140px; margin:4px auto 8px; border-width:3px; } .por.big span { font-size:76px; } .por.big.pad img { padding:12px; }
  .jpage { text-align:center; } .jpage h2 { padding:0 !important; } .jpage .lore { font-size:17px; font-style:italic; color:var(--ink); margin:6px 8px 12px; } .jpage .meta { font-size:14px; margin:4px 0; }
  .jpage img.story { width:100%; max-width:420px; border-radius:14px; display:block; margin:4px auto 8px; }
  .jrow { display:flex; align-items:center; gap:12px; padding:10px 0; border-top:1px solid rgba(43,36,24,.12); }
  .jrow .sil { width:40px; height:40px; border-radius:50%; background:var(--paper2); display:flex; align-items:center; justify-content:center; font-size:22px; flex:none; }
  .jrow.unseen .sil { filter:grayscale(1); opacity:.5; }
  .jrow .t b { font-weight:bold; display:block; font-size:17px; } .jrow .t span { font-size:14.5px; color:var(--ink2); }
  .close { position:absolute; right:8px; top:6px; width:44px; height:44px; background:none; border:0; font:inherit; font-size:30px; line-height:44px; color:var(--ink2); }
  #toast { position:fixed; left:50%; top:calc(env(safe-area-inset-top) + 68px); transform:translateX(-50%); background:rgba(243,233,210,.96); color:var(--ink); border-radius:14px; padding:10px 16px; font-size:16px; opacity:0; transition:opacity .25s; pointer-events:none; max-width:84vw; text-align:center; box-shadow:0 2px 8px rgba(0,0,0,.3); }
  /* the room: tap the home to look inside */
  #room { position:fixed; inset:0; background:rgba(10,12,8,.82); display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity .3s; z-index:5; }
  #room.on { opacity:1; pointer-events:auto; }
  #room .box { position:relative; width:min(94vw, 520px); background:var(--paper); border-radius:20px; padding:12px 12px 14px; box-shadow:0 6px 24px rgba(0,0,0,.5); }
  #room h2 { margin:2px 44px 8px 6px; font-size:21px; color:var(--ink); }
  #room canvas { width:100%; height:auto; aspect-ratio:1; border-radius:14px; display:block; background:#2a1d12; }
  #room p { margin:10px 6px 2px; font-size:16px; line-height:1.4; color:var(--ink2); min-height:44px; }
  #room .row2 { display:flex; gap:8px; margin:8px 4px 0; }
  /* the pack sheet */
  .pack { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:6px; }
  .pack div { background:rgba(43,36,24,.06); border-radius:12px; padding:8px 6px; text-align:center; font-size:14px; color:var(--ink2); }
  .pack div.zero { opacity:.45; }
  .pack img { width:40px; height:40px; display:block; margin:0 auto 2px; }
  .pack b { display:block; font-size:19px; color:var(--ink); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><h1>Gnome Life</h1><p id="sub"></p><p id="busy" class="busy"></p></div>
<div id="bubble"></div>
<div id="toast"></div>
<div id="bar">
  <div id="btns">
    <button class="btn" id="bPack"><span class="ic">🧺</span>Pack<i class="dot"></i></button>
    <button class="btn" id="bTasks"><span class="ic">🔨</span>Jobs<i class="dot"></i></button>
    <button class="btn" id="bMagic"><span class="ic">✨</span>Magic<i class="dot"></i></button>
    <button class="btn" id="bJournal"><span class="ic">📖</span>Journal<i class="dot"></i></button>
  </div>
</div>
<div id="shade"></div>
<div id="sheet"></div>
<div id="room"><div class="box"><button class="close" id="rClose">×</button><h2 id="rTitle"></h2><canvas id="rc" width="1000" height="1000"></canvas><p id="rCap"></p><div class="row2" id="rBtns"></div></div></div>
<div id="load">waking the garden…</div>
<script src="content.js"></script>
<script src="game.js"></script>
<script>
(() => {
const C = window.CONTENT, G = window.GL;
const SPR = 0.5;
const PLOT = { w:1225, h:728, top:[612,1], left:[3,346], right:[1221,347], bottom:[612,691] };
const EX = [PLOT.right[0]-PLOT.top[0], PLOT.right[1]-PLOT.top[1]];   // one tile east
const EY = [PLOT.left[0]-PLOT.top[0],  PLOT.left[1]-PLOT.top[1]];    // one tile south
const ASSETS = {
  plot:'sprites/plot-barren.webp',
  // painted ground tiles (art batch 1). stream + path are loaded but not placed yet: for the town/map pass.
  'tile-barren-plain':'sprites/tile-barren-plain.webp', 'tile-barren-stumps':'sprites/tile-barren-stumps.webp',
  'tile-green':'sprites/tile-green.webp', 'tile-meadow':'sprites/tile-meadow.webp', 'tile-woodland':'sprites/tile-woodland.webp',
  'tile-barren-creek':'sprites/tile-barren-creek.webp', 'tile-barren-fence':'sprites/tile-barren-fence.webp', 'tile-barren-deadtree':'sprites/tile-barren-deadtree.webp',
  // map tiles (batch 1 + 2), placed by MAP below. The bends and the fork are in sprites/ but not used: their stream/path ends don't line up.
  'tile-stream':'sprites/tile-stream.webp', 'tile-stream-spring':'sprites/tile-stream-spring.webp', 'tile-crossing':'sprites/tile-crossing.webp', 'tile-path':'sprites/tile-path.webp',
  shelter:'sprites/shelter.webp', campfire:'sprites/campfire.webp', firewood:'sprites/firewood.webp',
  barrel:'sprites/barrel.webp', seedbed:'sprites/seedbed.webp', stonebench:'sprites/stonebench.webp',
  tub:'sprites/tub.webp', lanternstump:'sprites/lanternstump.webp', wheelbarrow:'sprites/wheelbarrow.webp',
  fence:'sprites/fence.webp', sapling:'sprites/sapling.webp',
  'him-side':'sprites/him-side.png','him-front':'sprites/him-front.png','him-back':'sprites/him-back.png',
  'her-side':'sprites/her-side.png','her-front':'sprites/her-front.png','her-back':'sprites/her-back.png',
  'him-dig':'sprites/him-dig.png','him-water':'sprites/him-water.png','him-carry':'sprites/him-carry.png','him-eat':'sprites/him-eat.png','him-sit':'sprites/him-sit.png','him-sleep':'sprites/him-sleep.png',
  'her-dig':'sprites/her-dig.png','her-water':'sprites/her-water.png','her-carry':'sprites/her-carry.png','her-eat':'sprites/her-eat.png','her-sit':'sprites/her-sit.png','her-sleep':'sprites/her-sleep.png',
  'icon-twig':'sprites/icon-twig.webp','icon-moss':'sprites/icon-moss.webp','icon-stone':'sprites/icon-stone.webp','icon-acorn':'sprites/icon-acorn.webp','icon-seed':'sprites/icon-seed.webp',
  'icon-water':'sprites/icon-water.webp','icon-light':'sprites/icon-light.webp','icon-berry':'sprites/icon-berry.webp','icon-feather':'sprites/icon-feather.webp',
};
const GNOMES = {"him":{"cell":[108,242],"dirs":{"side":8,"front":8,"back":8},"acts":{"dig":{"n":4,"cell":[144,242]},"water":{"n":4,"cell":[129,245]},"carry":{"n":4,"cell":[140,260]},"eat":{"n":4,"cell":[118,241]},"sit":{"n":4,"cell":[127,208]},"sleep":{"n":4,"cell":[264,85]}}},"her":{"cell":[122,242],"dirs":{"side":8,"front":8,"back":8},"acts":{"dig":{"n":4,"cell":[159,242]},"water":{"n":4,"cell":[148,241]},"carry":{"n":6,"cell":[105,244]},"eat":{"n":4,"cell":[102,244]},"sit":{"n":4,"cell":[119,208]},"sleep":{"n":2,"cell":[264,73]}}}};

// ---------- world helpers ----------
function tileOrigin(k) { const [tx, ty] = k.split(',').map(Number); return [tx*EX[0] + ty*EY[0], tx*EX[1] + ty*EY[1]]; }
function toWorld(gx, gy, tile = '0,0') {         // tile grid (0..1, 0..1) -> world pixel coords
  const [ox, oy] = tileOrigin(tile), [tx, ty] = PLOT.top, [rx, ry] = PLOT.right, [lx, ly] = PLOT.left;
  return [ox + tx + gx * (rx - tx) + gy * (lx - tx), oy + ty + gx * (ry - ty) + gy * (ly - ty)];
}
function fromWorld(wx, wy) {                       // world pixel -> { tile, gx, gy } (any tile, may be outside 0..1)
  const [tx, ty] = PLOT.top, a = PLOT.right[0]-tx, b = PLOT.left[0]-tx, c = PLOT.right[1]-ty, d = PLOT.left[1]-ty;
  const det = a*d - b*c, px = wx - tx, py = wy - ty;
  const u = (px*d - b*py) / det, v = (a*py - c*px) / det;           // continuous tile coords
  const txi = Math.floor(u), tyi = Math.floor(v);
  return { tile: `${txi},${tyi}`, gx: u - txi, gy: v - tyi };
}
function depthOf(gx, gy, tile = '0,0') { const [tx, ty] = tile.split(',').map(Number); return gx + gy + tx + ty; }

// ---------- scene content (home tile) ----------
const PROPS = [
  { name:'shelter',      gx:0.30, gy:0.22, s:1.0 },
  { name:'firewood',     gx:0.14, gy:0.40, s:0.9, until:'woodpile' },
  { name:'barrel',       gx:0.40, gy:0.42, s:0.9 },
  { name:'campfire',     gx:0.52, gy:0.44, s:0.9 },
  { name:'stonebench',   gx:0.66, gy:0.30, s:0.9, until:'bench' },
  { name:'lanternstump', gx:0.78, gy:0.50, s:0.9 },
  { name:'seedbed',      gx:0.60, gy:0.70, s:1.0, flat:true, until:'bed' },   // until: hidden until that job is done (fades in while it runs)
  { name:'tub',          gx:0.44, gy:0.76, s:0.85 },
  { name:'wheelbarrow',  gx:0.26, gy:0.62, s:0.9 },
  { name:'fence',        gx:0.86, gy:0.78, s:0.9 },
  { name:'sapling',      gx:0.72, gy:0.86, s:0.8 },
];
const SPOTS = {   // places the gnomes like to go (home tile)
  door:[0.36,0.33], fire:[0.46,0.52], bench:[0.62,0.36], bed:[0.56,0.66], barrel:[0.46,0.44],
  tub:[0.40,0.72], sprout:[0.50,0.52], barrow:[0.32,0.66], lantern:[0.72,0.56], fence:[0.80,0.72]
};
// where each gnome eats, sits and sleeps (daily rhythm); [gx, gy, faceTowards]
const RHYTHM = {
  him: { eat:[0.40,0.56,'campfire'], sit:[0.38,0.60,'campfire'], sleep:[0.24,0.40,null] },
  her: { eat:[0.60,0.38,'campfire'], sit:[0.62,0.42,'campfire'], sleep:[0.52,0.24,null] },
};
const ACT_FPS = { dig:4, water:3, carry:9, eat:2.5, sit:1.6, sleep:0.7 };
const SPOT_ACT = { feeder:'carry', wheelbarrow:'dig', seedbed:'water', sapling:'water', shelter:'carry', fence:'carry', stonebench:'carry', fire:'carry' };
function routineFor(h) {   // what the couple do at this hour when no job needs them
  if (h >= 22 || h < 6) return 'sleep';
  if ((h >= 7 && h < 8) || (h >= 18 && h < 19)) return 'eat';
  if (h >= 19 && h < 22) return 'sit';
  return null;
}
const WORKSPOT = { feeder:[0.68,0.62], clearing:[0.54,0.66], wheelbarrow:[0.30,0.68], shelter:[0.38,0.30], fence:[0.80,0.74], sapling:[0.66,0.84], stonebench:[0.60,0.36], seedbed:[0.54,0.66] };

// ---------- loading ----------
const IM = {};
let loaded = 0; const total = Object.keys(ASSETS).length;
for (const [k, src] of Object.entries(ASSETS)) {
  const im = new Image(); im.onload = im.onerror = () => { if (++loaded === total) start(); }; im.src = src; IM[k] = im;
}
// ---------- art slots ----------
// Painted pictures still to come (docs/ART-BATCH-3.md). Each one is optional: drop sprites/<name>.webp in and the game uses it
// instead of its code-drawn stand-in, with no code change (tools/slot_in_art.py makes the files). Missing files are fine.
// w = drawn width in world pixels (props are drawn at half their sprite size), or 'like:<sprite>' = same width as that sprite.
const ART_SLOTS = {
  'plot-ruts-filled': {},                     // home tile once the ruts are filled (crossfades in while Wendel works)
  'plot-cleared':     {},                     // home tile once the ruts are filled AND the ground is cleared
  'shelter-mossroof': { w:'like:shelter' },   // "Moss for the shelter roof"
  'fence-fallen':     { w:'like:fence' },     // the fence BEFORE it is mended (the existing fence is the after)
  'oak-planted':      { h: 92 },              // "Plant the sapling out" (drawn by height: it is taller than the potted one)
  'barrel-full':      { w:'like:barrel' },    // "Scrub the rain barrel"
  'lantern-lit':      { w:'like:lanternstump' }, // "Mend the old lantern" (the glow stays code)
  'washing-line':     { w: 150 },             // "String up a washing line"
  'stick-pile':       { w: 90 },              // "Clear the ground": the gathered pile
  'yard-doorstep':    { w: 70 },              // "Lay a flat-stone doorstep"
  'yard-windowbox':   { w: 30 },              // "Hang a window box"
  'yard-stones':      { w: 64 },              // loose stones where the bench will be
  'yard-firewood':    { w: 84 },              // loose sticks where the woodpile will be
  'stepping-stones':  { w: 210 },             // "Lay a stepping-stone path"
  // night lights (docs/ART-BATCH-8.md): glow-worm lanterns and street lamps (the glow itself stays code)
  'worm-lantern':     { w: 34 },              // "Hang glow-worm lanterns": one small hanging lantern, drawn at each hook
  'worm-lamp':        { w: 44 },              // "Set glow-worm street lamps": one lamp post, drawn at each spot
  // home stage 2 (docs/ART-BATCH-4.md): the shelter stump turning into a house, one picture per job, each the WHOLE stump
  'house-hollowed':   { w:'like:shelter' },   // "Hollow out the old stump"
  'house-windows':    { w:'like:shelter' },   // "Fit a plank wall and windows"
  'house-finished':   { w:'like:shelter' },   // "Raise the roof and chimney": home stage 2
  // the room you see when you tap the home: square paintings, no gnomes in them (the gnomes are drawn on top, see ROOMS)
  'room-shelter': {}, 'room-stump': {},
  'btn-pack': {}, 'btn-jobs': {}, 'btn-magic': {}, 'btn-journal': {},   // painted button icons
};
// visitors and the journal (docs/ART-BATCH-5.md): vis-<id> is the creature in the garden (side view; faces in CONTENT says which way),
// portrait-<id> is its round journal picture (optional: the journal falls back to vis-<id>, then to the stand-in icon)
for (const v of C.visitors) { ART_SLOTS['vis-' + v.id] = {}; ART_SLOTS['portrait-' + v.id] = {}; }
// neighbours and the village (docs/ART-BATCH-6.md): folk-<id> a standing neighbour (folk-<id>-2.. for the rest of a household), face-<id> an
// optional round portrait, home-<id> their home, bld-<id> their trade building, story-<id> the picture at the end of their story,
// story-<id>-home when they move in, find-<id> the thing you look for in their story; plus the bridge, the traveller's tent, a glow jar, new icons.

  else { const d = new Date(); h = d.getHours() + d.getMinutes() / 60; }

function journalFoot(v) {   // what you know about a creature's feeding, nest and good deeds, in words
  const e = G.s.journal[v.id] || {}, F = C.feeding, n = (e.fed || []).length, bits = [];
  if (v.eats && n) bits.push(G.hasNest(v.id) ? `Lives nearby now.` : G.isRegular(v.id) ? `A regular: comes by every day.${v.nest ? ` Fed on ${n} days; it may settle nearby after ${F.nestAfter}.` : ''}` : `Fed at the dish on ${n} of ${F.regularAfter} days it needs to become a regular.`);
  else if (v.eats && G.dishBuilt()) bits.push(`Might come to the dish for ${v.eats.map(k => k === 'seed' ? 'seed' : 'berries').join(' or ')}.`);
  if (e.helped) bits.push(`You have helped it ${e.helped === 1 ? 'once' : e.helped + ' times'}.`);
  return bits.join(' ');
}
function openJournal() {
  const seen = C.visitors.filter(v => G.met(v.id)).length, regs = C.visitors.filter(v => G.isRegular(v.id)).length;
  let html = `<h2>Field journal<small>${seen} of ${C.visitors.length} met${regs ? ` · ${regs} regular${regs > 1 ? 's' : ''}` : ''}</small></h2><p>Tap a visitor in the garden to note it down; a soft glow means someone new. Tap a page to read it.</p>${neighboursHtml()}<div class="jgrid">`;
  for (const v of C.visitors) { const m = G.met(v.id); html += `<button class="jcard${m ? '' : ' unseen'}" data-a="${m ? 'entry' : ''}" data-id="${v.id}">${portraitHtml(v)}<b>${m ? v.name : '?'}</b>${G.hasNest(v.id) ? '<i>lives here</i>' : G.isRegular(v.id) ? '<i>regular</i>' : ''}</button>`; }
  html += `</div>`;
  const log = [...G.s.log].reverse().slice(0, 8);
  if (log.length) html += `<h3>Lately</h3>` + log.map(l => `<p style="margin:2px 0">${l.text}</p>`).join('');
  openSheet('journal', html); btnAlert('bJournal', false);
}
function openEntry(id) {
  const v = G.visitorDef(id), e = G.s.journal[id];
  const foot = journalFoot(v);
  openSheet('entry', `<p style="margin:0 0 4px"><button class="act quiet" data-a="journal">‹ Journal</button></p><div class="jpage">${portraitHtml(v, true)}<h2>${v.name}</h2><p class="lore">${v.note}</p>
    <p class="meta">First seen ${new Date(e.first).toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' })} · met ${e.count === 1 ? 'once' : e.count + ' times'}</p>${foot ? `<p class="meta">${foot}</p>` : ''}</div>`);
}
function openFeeder() {
  if (taskProg('feeder') < 1) return openTasks('feeder');
  const f = G.s.feeder.food, F = C.feeding;
  let html = `<h2>The feeding dish</h2>`;
  if (f) html += `<p>There ${f === 'seed' ? 'is seed' : 'are berries'} in the dish. Someone will be along. Things go quicker while there is food out.</p>`;
  else {
    html += `<p>Put something out and see who comes. A creature fed here on ${F.regularAfter} different days becomes a regular and comes by every day; some may even make a home nearby.</p>`;
    for (const k of F.foods) { const n = G.s.inv[k] || 0; html += `<div class="row"><div class="t"><b>Put out ${k === 'seed' ? 'seed' : 'berries'}</b><span>Costs ${costHtml({ [k]: 1 })} · you have ${n}</span></div><button class="act" data-a="food" data-id="${k}" ${n ? '' : 'disabled'}>Put out</button></div>`; }
  }
  const met = C.visitors.filter(v => v.eats && G.met(v.id));
  if (met.length) html += `<h3>Who eats what</h3>` + met.map(v => `<p style="margin:2px 0"><b>${v.name}</b>: ${v.eats.map(k => k === 'seed' ? 'seed' : 'berries').join(', ')}${G.isRegular(v.id) ? ' · regular' : ` · fed ${G.fedDays(v.id)} of ${F.regularAfter} days`}</p>`).join('');
  openSheet('feeder', html);
}
function openHelp() {
  const v = visitor; if (!v || !v.trouble) return;
  openSheet('help', `<div class="jpage">${portraitHtml(v.def, true)}<h2>The ${v.def.name.toLowerCase()}</h2><p class="lore">The ${v.def.name.toLowerCase()} ${v.trouble.text}</p></div><p style="text-align:center"><button class="act" data-a="help">${v.trouble.act}</button></p>`);
}
function doHelp() {
  const v = visitor; if (!v || !v.trouble) return closeSheet();
  G.entry(v.def.id); if (!G.met(v.def.id)) G.noteVisitor(v.def.id);
  const light = G.help(v.def.id), [x, y] = toWorld(v.gx, v.gy);
  float(light ? '+1 light ♥' : '♥', x, y - (v.def.h || 30));
  openSheet('help', `<div class="jpage">${portraitHtml(v.def, true)}<h2>Thank you</h2><p class="lore">${v.trouble.thanks}</p><p class="meta">${light ? 'A good deed: +1 light.' : 'A good deed. (No more light from good deeds today, but it was still the right thing.)'}</p></div><p style="text-align:center"><button class="act" data-a="close">You're welcome</button></p>`);
  v.trouble = null; v.stay = v.t + 8;
}
// ---------- neighbours: their page, the traveller's page, story pages ----------
function folkPor(f, big) { return `<div class="por${big ? ' big' : ''}"><img src="${folkPortrait(f)}" alt=""></div>`; }
const pick = a => a[(Math.random() * a.length) | 0];
function openTraveller() {
  const tr = G.s.village.traveller; if (!tr) return;
  const f = G.folkDef(tr.id), v = G.taskView(G.taskDef('home:' + f.id)), d = v.def;
  let html = `<div class="jpage">${folkPor(f, true)}<h2>${f.name}</h2><p class="meta">${f.trade}, camped by the path</p><p class="lore">${f.intro}</p></div><h3>Will they stay?</h3>`;
  if (v.state === 'running') html += `<div class="row"><div class="t"><b>${d.name}</b><span><span class="who">${C.names[d.who]}</span> is on it · ${G.timeLeft(v.endsAt)} to go</span></div></div>`;
  else {
    html += `<div class="row"><div class="t"><b>${d.name}</b><span>${d.blurb}</span><br><span>` + (v.locked ? `<span class="bad">${v.why}</span>` : `<span class="who">${C.names[d.who]}</span> needs <span class="cost">${costHtml(d.cost)}</span> · ${hours(d.mins)}` + (v.can ? '' : `<br><span class="bad">You are short ${v.missing.join(', ')}.</span>`)) + `</span></div><button class="act" data-a="start" data-id="${d.id}" ${v.state === 'ready' && v.can ? '' : 'disabled'}>Build</button></div>`;
    html += `<p style="margin-top:12px">Not the right neighbour? <button class="act quiet" data-a="wave">Wave them on</button><br><small>They will go on along the road, and someone else will come by in a day or so.</small></p>`;
  }
  openSheet('traveller', html);
}
function folkStory(fid) {   // the story part of a neighbour's page, in words, with whatever button it needs
  const f = G.folkDef(fid), fs = G.folkState(fid), st = G.questStep(fid);
  if (fs.q === 'done') return `<h3>${f.quest.name}</h3><p>A story you helped finish. <button class="act quiet" data-a="story" data-id="${fid}">Read it again</button></p>`;
  if (!st) return taskProg('trade:' + fid) >= 1 ? `<p><small>${f.short[0].toUpperCase() + f.short.slice(1)} will have a story for you before long.</small></p>` : '';
  let btn = '';
  if (st.give) btn = `<span class="cost">${costHtml(st.give)}</span><br>` + (G.can(st.give) ? `<button class="act" data-a="qgive" data-id="${fid}">Give</button>` : `<span class="bad">You are short ${G.missing(st.give).join(', ')}.</span>`);
  else if (st.job) { const v = G.taskView(G.taskDef(`quest:${fid}:${fs.q}`)); btn = v.state === 'running' ? `<span><span class="who">${C.names[st.job.who]}</span> is on it · ${G.timeLeft(v.endsAt)} to go</span>` : `<span class="who">${C.names[st.job.who]}</span> needs <span class="cost">${costHtml(st.job.cost)}</span> · ${hours(st.job.mins)}<br>` + (v.can ? `<button class="act" data-a="start" data-id="${v.def.id}">${st.job.name}</button>` : `<span class="bad">You are short ${v.missing.join(', ')}.</span>`); }
  else if (st.find) btn = `<span>Look for <b>${st.find.name}</b> on the land${st.find.hours ? ' (after dark)' : ''}. It will glow softly.</span>`;
  else if (st.wait) btn = `<span>Come back in ${G.timeLeft(fs.waitUntil)}.</span>`;
  return `<h3>${f.quest.name} · part ${fs.q + 1} of ${f.quest.steps.length}</h3><p class="lore" style="text-align:left;margin:4px 0 8px">${st.say}</p><p>${btn}</p>`;
}
function openFolk(fid) {
  const f = G.folkDef(fid), fs = G.folkState(fid); if (!fs) return openTraveller();
  if (typeof fs.q === 'number' && fs.q >= 0) fs.seen = fs.q;   // you've read the latest part of their story
  let html = `<div class="jpage">${folkPor(f, true)}<h2>${f.name}</h2><p class="meta">${f.trade}${f.members ? '' : ''} · neighbours since ${new Date(fs.since).toLocaleDateString(undefined, { day: 'numeric', month: 'long' })}</p><p class="lore">"${pick(f.sayings)}"</p></div>`;
  const fv = G.s.village.favour;
  if (fv && fv.folk === fid) { const ask = f.favours[fv.i]; html += `<h3>A small favour</h3><div class="row"><div class="t"><b>"${ask.ask}"</b><span class="cost">${costHtml(ask.cost)}</span>${G.can(ask.cost) ? '' : `<br><span class="bad">You are short ${G.missing(ask.cost).join(', ')}.</span>`}</div><button class="act" data-a="favour" ${G.can(ask.cost) ? '' : 'disabled'}>Help</button></div>`; }
  const tv = G.taskView(G.taskDef('trade:' + fid)), b = tv.def;
  if (tv.state !== 'done') html += `<h3>${b.name}</h3><div class="row"><div class="t"><span>${b.blurb}</span><br><span>` + (tv.state === 'running' ? `<span class="who">${C.names[b.who]}</span> is on it · ${G.timeLeft(tv.endsAt)} to go` : `<span class="who">${C.names[b.who]}</span> needs <span class="cost">${costHtml(b.cost)}</span> · ${hours(b.mins)}` + (tv.can ? '' : `<br><span class="bad">You are short ${tv.missing.join(', ')}.</span>`)) + `</span></div>${tv.state === 'ready' ? `<button class="act" data-a="start" data-id="${b.id}" ${tv.can ? '' : 'disabled'}>Start</button>` : ''}</div>`;
  else html += `<p><small>${b.giftText.replace(/\.$/, '')}: every day.</small></p>`;
  html += folkStory(fid);
  openSheet('folk:' + fid, html);
}
function storyPic(key, f) {   // a painted story picture (art slot story-<key>), else the neighbour's portrait as a stand-in
  return art('story-' + key) ? `<img class="story" src="sprites/story-${key}.webp" alt="">` : folkPor(f, true);
}
function openStory(fid, kind) {
  const f = G.folkDef(fid);
  if (kind === 'moved') openSheet('story', `<div class="jpage">${storyPic(fid + '-home', f)}<h2>${f.name} moved in</h2><p class="lore">${f.movedIn}</p><p class="meta">Next job: ${f.building.name}.</p></div><p style="text-align:center"><button class="act" data-a="folk" data-id="${fid}">Say hello</button></p>`);
  else if (kind === 'arrived') openSheet('story', `<div class="jpage">${folkPor(f, true)}<h2>A traveller on the path</h2><p class="lore">${f.intro}</p></div><p style="text-align:center"><button class="act" data-a="traveller">Go and see</button> <button class="act quiet" data-a="close">Later</button></p>`);
  else { const r = f.quest.reward; openSheet('story', `<div class="jpage">${storyPic(fid, f)}<h2>${f.quest.story.title}</h2><p class="lore" style="text-align:left">${f.quest.story.text}</p><p class="meta">The end of ${f.short}'s story. ${r ? 'A gift for you: ' + costHtml(r) : ''}</p></div><p style="text-align:center"><button class="act" data-a="close">Close the book</button></p>`); }
}
function neighboursHtml() {   // the journal's neighbours section
  const v = G.s.village, ids = Object.keys(v.folk); if (!ids.length && !v.traveller) return '';
  let html = `<h3>Neighbours</h3><div class="jgrid">`;
  for (const fid of ids) { const f = G.folkDef(fid); html += `<button class="jcard" data-a="folk" data-id="${fid}"><div class="por"><img src="${folkPortrait(f)}" alt=""></div><b>${f.short[0].toUpperCase() + f.short.slice(1)}</b><i>${folkNeedsYou(fid) ? 'has news' : f.trade}</i></button>`; }
  if (v.traveller) { const f = G.folkDef(v.traveller.id); html += `<button class="jcard" data-a="traveller"><div class="por"><img src="${folkPortrait(f)}" alt=""></div><b>${f.short[0].toUpperCase() + f.short.slice(1)}</b><i>camped by the path</i></button>`; }
  return html + `</div><h3>Creatures</h3>`;
}
function openAway(r) {
  const mins = Math.round(r.gone / 60000); if (mins < 10 && !r.finished.length && !r.ate) return r.traveller ? openStory(r.traveller, 'arrived') : undefined;
  const gone = mins < 60 ? `${mins} minutes` : mins < 60 * 36 ? `${Math.round(mins / 60)} hours` : `${Math.round(mins / 1440)} days`;
  let html = `<h2>While you were away<small>${gone}</small></h2>`;
  if (r.event) html += `<p>${r.event}</p>`;
  if (r.ate) html += `<p>The ${r.ate.toLowerCase()} came by and emptied the feeding dish.</p>`;
  if (r.traveller) { const f = G.folkDef(r.traveller); html += `<p>A traveller has camped by the path: <b>${f.name}</b>, ${f.trade}. Tap their tent to meet them.</p>`; }
  if (r.newDay) html += `<p>A new day. Their magic has grown a little: ${G.magicInfo().name}.</p>`;
  if (r.offered) html += `<p>The land has left ${r.offered} thing${r.offered > 1 ? 's' : ''} for you to gather.</p>`;
  for (const f of r.finished) html += `<p>✓ ${f}</p>`;
  if (!r.offered && !r.finished.length && !r.newDay) html += `<p>Quiet. The fire kept going.</p>`;
  openSheet('away', html + `<p style="margin-top:10px"><button class="act" data-a="close">Have a look</button></p>`);
}
$('bPack').onclick = openPack; $('bTasks').onclick = () => openTasks(); $('bMagic').onclick = openMagic; $('bJournal').onclick = openJournal;
G.onChange((kind, data) => { renderInv(kind === 'inv' && typeof data === 'string' ? data : null); renderHud(); if (kind === 'task' && data && data.done) { toast('Finished: ' + lcName(G.taskDef(data.id).name) + '.'); } if (kind === 'event') toast(data.text); if (kind === 'land') toast(`The home patch is now ${data.name}.`);
  if (kind === 'traveller' && data) { btnAlert('bJournal', true); if (!sheetKind) openStory(data, 'arrived'); else toast('A traveller has camped by the path.'); }
  if (kind === 'story') { btnAlert('bJournal', true); openStory(data.folk, data.kind); }
  if (kind === 'quest') btnAlert('bJournal', true);
  if (kind === 'favour') { const f = G.folkDef(data); toast(`${f.short[0].toUpperCase() + f.short.slice(1)} could use a small favour.`); } });

// ---------- start ----------
function start() {
  G.boot();
  for (const p of PROPS) IM[p.name] = settle(IM[p.name], p.flat);
  document.getElementById('load').remove();
  gnomes.push(new Gnome('him', 0.46, 0.50), new Gnome('her', 0.40, 0.40));
  gnomes[1].wait = 0.5;
  for (const g of gnomes) g.settleIn();
  cam.z = clampZ(G.s.flags.welcomed ? Math.max(1.5, minZ * 2.4) : 0.95);   // first visit: far enough out to see the whole yard
  [cam.x, cam.y] = G.s.flags.welcomed ? toWorld((gnomes[0].gx + gnomes[1].gx) / 2, (gnomes[0].gy + gnomes[1].gy) / 2) : toWorld(0.5, 0.5); clampCam();
  renderInv(); renderHud();
  const [a, b] = C.visitorEvery; nextVisitorAt = performance.now() + (G.FAST ? 5 : 25 + Math.random() * 30) * 1000;
  if (/vis=(\w+)/.test(hash)) { const def = C.visitors.find(v => v.id === RegExp.$1); if (def) spawnVisitor(def); }
  G.view = () => ({ visitor, cam, W, H }); G.toWorld = toWorld;   // for test scripts
  requestAnimationFrame(frame);
  loadArtSlots();
  if (/test/.test(hash)) { const b = document.createElement('button'); b.className = 'act'; b.textContent = '🧪 Test'; b.style.cssText = 'position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 10px);z-index:5;min-height:40px;padding:8px 12px'; b.onclick = openTest; document.body.appendChild(b); }
  if (G.away) openAway(G.away);
  if (!G.s.flags.welcomed) {
    G.s.flags.welcomed = true; G.save();
    openSheet('welcome', `<h2>Welcome to the garden</h2><p>Wendel and Hazel, two small gnomes, have just arrived in this logged clearing. You are their unseen helper spirit.</p><h3>How it works</h3><p>✨ <b>Touch the softly glowing things.</b> Things lying on the ground go into your pack (🧺 Pack).</p><p>🔨 <b>A soft glow behind their belongings means a job you can start.</b> Give the materials and a gnome gets to work while you go about your day.</p><p>Come back whenever you like: the land leaves something new for you each time.</p><p style="margin-top:12px"><button class="act" data-a="close">Let's begin</button></p>`);
  }
}
})();
</script>
